<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DeuClient-Emblem: gruener Edelstein mit gruenem Kern und funkelndem Stern (✦) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123019"/>
      <stop offset="0.55" stop-color="#0c1f13"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0b1f12"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#22c55e" stroke-opacity="0.55" stroke-width="6"/>
  <circle cx="256" cy="240" r="230" fill="url(#glow)"/>
  <!-- Edelstein-Außenform -->
  <polygon points="256,62 424,232 256,446 88,232" fill="url(#gold)"/>
  <polygon points="256,62 424,232 256,232" fill="url(#goldSide)" opacity="0.55"/>
  <polygon points="88,232 256,446 256,232" fill="#14532d" opacity="0.25"/>
  <!-- violetter Kern -->
  <polygon points="256,128 362,234 256,374 150,234" fill="url(#core)"/>
  <polygon points="256,128 362,234 256,234" fill="#ffffff" opacity="0.12"/>
  <!-- Stern ✦ -->
  <path d="M256 168 Q263 222 316 234 Q263 246 256 302 Q249 246 196 234 Q249 222 256 168 Z" fill="url(#star)"/>
  <circle cx="352" cy="128" r="9" fill="#bbf7d0"/>
  <circle cx="150" cy="370" r="6" fill="#bbf7d0" opacity="0.8"/>
</svg>
